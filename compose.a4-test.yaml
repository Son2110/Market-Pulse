services:
  mongodb:
    image: mongo:8.0
    restart: "no"
    labels:
      com.marketpulse.suite: "a4-recovery-test"
    ports:
      - "127.0.0.1:${A4_MONGO_PORT:-27027}:27017"
    volumes:
      - a4-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7.4-alpine
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    labels:
      com.marketpulse.suite: "a4-recovery-test"
    ports:
      - "127.0.0.1:${A4_REDIS_PORT:-6389}:6379"
    volumes:
      - a4-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15


  api:
    extends:
      file: compose.yaml
      service: api
    profiles: [routing]
    labels:
      com.marketpulse.suite: "a4-recovery-test"
    ports: !override
      - "127.0.0.1:${A4_API_PORT:-3007}:3001"
    environment:
      INGESTION_SECRET: ${A4_INGESTION_SECRET:-}
    restart: "no"

  worker:
    extends:
      file: compose.yaml
      service: worker
    profiles: [routing]
    labels:
      com.marketpulse.suite: "a4-recovery-test"
    restart: "no"

  web:
    extends:
      file: compose.yaml
      service: web
    profiles: [routing]
    labels:
      com.marketpulse.suite: "a4-recovery-test"
    ports: !override
      - "127.0.0.1:${A4_WEB_PORT:-5177}:5173"

  collector:
    extends:
      file: compose.yaml
      service: collector
    profiles: [collector]
    labels:
      com.marketpulse.suite: "a4-recovery-test"
    environment:
      INGESTION_SECRET: ${A4_INGESTION_SECRET:-}

volumes:
  a4-mongo-data:
    labels:
      com.marketpulse.suite: "a4-recovery-test"
  a4-redis-data:
    labels:
      com.marketpulse.suite: "a4-recovery-test"
