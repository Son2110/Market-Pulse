name: marketpulse

services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      MONGODB_URL: mongodb://mongodb:27017/marketpulse?serverSelectionTimeoutMS=1000
      REDIS_URL: redis://redis:6379
      CONNECT_ATTEMPTS: 5
      CONNECT_DELAY_MS: 500
      DEPENDENCY_TIMEOUT_MS: 1000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:5
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: ["npm", "run", "dev", "--workspace=@marketpulse/web", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  collector:
    profiles: ["collector"]
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    command: ["fixtures/market/mp-02-synthetic.json"]

volumes:
  mongo-data:
  redis-data:
